ReleaseNotes: "New Features\n- The LaTeX class \u2018jss\u2019 bundled in \u2018share/texmf/tex/latex/jss.cls\u2019
  has been updated to work with \u2018hyperref\u2019 version 7.01q (2026/04/24).\n-
  Plain-text (and legacy HTML) conversion for a simple Rd \\eqn{} now handles \\geq,
  \\leq, \\neq and \\ne in addition to \\ge and \\le (PR#19070).\nBug Fixes\n- abbreviate(<non-ASCII>)
  now works better, using iswlower() and *upper() to treat \u201Cwide\u201D characters,
  thanks to Kevin's PR#19058.\n- cut(1:11, {}) now signals an error for the invalid
  breaks, fixing PR#19057, thanks to Kevin Ushey.\n- all(<symbol>) signals an error
  now, as some similar coercions; previously, the coercion of the symbol resulted
  in NULL internally, raised a warning, and could access illegal memory; thanks to
  Kevin Ushey's PR#19054.\n- stl() now checks its 3 x 3 tuning parameters on the R
  level; stl(*, s.window = 0) now \u201Cworks\u201D instead dumping core, stl(*, s.window
  = 1) \u201Cworks\u201D correctly, too. Also, the summary() method mentions the robustness
  weights only if any robustness iterations happened.\n  Further, stl() is now based
  on C code, translated from previous Fortran, triggered by a flang 22 compiler optimization
  bug (-O2).\n- The border case zapsmall(x, digits=Inf) where x contains an Inf entry
  no longer returns all NaN but rather x. The improved help page now has more non-default
  examples.\n- wilcox.test(x, exact=FALSE, correct = k)'s p-value computation got
  a missing dnorm(z) factor, and so did the 2-sample case, in addition to more fixes.\n-
  The data part of getGenerics() listed package names for generic functions defined
  in more than one package. Now it lists generic function names, as intended. Thanks
  to Michael Chirico for report and patch proposal (PR#19080).\n- Overly long dyn.load()
  error messages (C level dlerror()), should no longer corrupt its state, thanks to
  Ivan Krylov's PR#19029 report and patch.\n- as.matrix(<POSIXlt>) again produces
  a numeric matrix, and the c() and subassignment methods for POSIXlt objects work
  correctly more often, e.g., without a \"tzone\" attribute, back porting a few of
  the PR#18989 fixes from R-devel, both thanks to Suharto Anggono.\n- In methods,
  as() now correctly coerces S4 objects to S4 superclasses extending old-style classes,
  instead of returning only the S3 part."
